    var t = localStorage.getItem('bc-usach-theme');
    var amig = localStorage.getItem('bc-usach-amigable') === 'on';
    if(amig){ document.documentElement.setAttribute('data-theme', 'amigable'); }
    else if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
</script>
